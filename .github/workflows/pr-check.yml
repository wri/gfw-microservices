name: PR-Check

on:
  pull_request:
    branches: [main, develop, qa, staging]

# nx cache intermittently fails with github actions, likely due to parallelism
# so disabling the check for now
env:
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  Check-Format:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --legacy-peer-deps \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 && break
            echo "npm ci failed (attempt $i). Retrying in 15s..."
            sleep 15
          done

      - name: Check code format
        run: npx nx format:check --base origin/develop

  Check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --legacy-peer-deps \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 && break
            echo "npm ci failed (attempt $i). Retrying in 15s..."
            sleep 15
          done

      - name: Run Lint
        run: npx nx affected --target=lint --parallel=3

  Run-Test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --legacy-peer-deps \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 && break
            echo "npm ci failed (attempt $i). Retrying in 15s..."
            sleep 15
          done

      - name: Run Test
        run: npx nx affected --target=test --parallel=3 --configuration=ci --coverage

  Build-All:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --legacy-peer-deps \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 && break
            echo "npm ci failed (attempt $i). Retrying in 15s..."
            sleep 15
          done

      - name: Build all services
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx nx run-many --target=build --all --parallel=3

  NPM-Audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Full audit — informational, never fails the build. Surfaces drift in PRs.
      - name: npm audit (report all)
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=low && break
            echo "npm audit failed (attempt $i). Retrying in 15s..."
            sleep 15
          done || true

      # Hard gate: fail the build only on critical-severity advisories.
      - name: npm audit (fail on critical)
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=critical --omit=dev && exit 0
            status=$?
            # Exit code 1 from npm audit means advisories were found — do not retry.
            if [ "$status" = "1" ]; then exit 1; fi
            echo "npm audit errored (attempt $i, status=$status). Retrying in 15s..."
            sleep 15
          done
          exit 1

  # Disabled the fitness test github action because the underlying test is already disabled
