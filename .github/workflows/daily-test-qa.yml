name: QA e2e Tests

on:
  schedule:
    # Runs at 6 AM UTC (one hour after automatic-release.yml) every weekday
    - cron: '0 6 * * 1-5'

# nx cache intermittently fails with github actions, likely due to parallelism
# so disabling the check for now
env:
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  test_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ssh-key: '${{ secrets.DEPLOY_KEY }}'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install settings
        run: |
          echo "${{secrets.EAPI_E2E_SETTINGS}}" > ./apps/microservices/externalapi-e2e/jest.set.env.ts
          echo "${{secrets.CYPRESS_SETTINGS}}" | tr "'" '"' > ./apps/gfwpro-e2e/cypress.env.json
          pwd
          ls -l ./apps/microservices/externalapi-e2e/jest.set.env.ts
          cat ./apps/microservices/externalapi-e2e/jest.set.env.ts
          ls -l ./apps/gfwpro-e2e/cypress.env.json
          cat ./apps/gfwpro-e2e/cypress.env.json

      - name: Run QA e2e tests
        run: |
          npx nx e2e externalapi-e2e --configuration=qa  &&
          npx nx e2e gfwpro-e2e --configuration=qa

      - name: Send failure notifications to Slack
        # disabled failure check for testing
        # if: failure()
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_TEST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "QA e2e test status ${{ job.status }}. Please check the logs ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "username": "GitHub Actions",
            "icon_emoji": ":octocat:"
          }' $SLACK_WEBHOOK_URL
