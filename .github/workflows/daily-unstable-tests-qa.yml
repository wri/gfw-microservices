name: Unstable QA e2e Tests

on:
  schedule:
    # Runs at 6 AM UTC (one hour after automatic-release.yml) every weekday
    - cron: '0 8 * * 1-5'

# nx cache intermittently fails with github actions, likely due to parallelism
# so disabling the check for now
env:
  UNSTABLE: 'apps/gfwpro-e2e/cypress/e2e/features/InformationBubbles.feature,apps/gfwpro-e2e/cypress/e2e/features/palmRiskAssessment.feature'
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  test_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Timeout the workflow after 120 minutes = 2 hours

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: '${{ secrets.DEPLOY_KEY }}'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install settings
        run: |
          echo "${{secrets.CYPRESS_SETTINGS}}" | tr "'" '"' > ./apps/gfwpro-e2e/cypress.env.json

      - name: Run unstable QA e2e tests for GFW Pro
        run: |
          npx nx e2e gfwpro-e2e --configuration=qa --spec $UNSTABLE

      - name: Upload videos of tests failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: dist/cypress/apps/gfwpro-e2e/videos
          retention-days: 2
