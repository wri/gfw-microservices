name: PR-Check

on:
  pull_request:
    branches: [main, develop, qa, staging]

# nx cache intermittently fails with github actions, likely due to parallelism
# so disabling the check for now
env:
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  Check-Format:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.5.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check code format
        run: npx nx format:check

  Check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.5.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Lint
        run: npx nx affected --target=lint --parallel=3

  Run-Test:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.5.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Test
        run: npx nx affected --target=test --parallel=3 --configuration=ci --coverage

  Run-Webserver-Fitness-Test:
    needs: [Check-Format, Check-lint, Run-Test]
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Timeout the workflow

    strategy:
      matrix:
        node-version: [20.5.1]

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v1
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Test
        env:
          NODE_OPTIONS: '--max_old_space_size=6144'
        run: npx nx run webserver:test-fitness --configuration=ci
