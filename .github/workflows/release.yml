name: Create Release for Labeled Service

on:
  pull_request:
    types:
      - closed
      - labeled
    branches:
      - develop

jobs:
  check-skip-by-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR title contains skip-jobs
        id: check_title
        run: |
          if [[ "${{ github.event.pull_request.title }}" == *"skip-jobs"* ]]; then
            echo "PR title contains 'skip-jobs'."
            echo "::set-output name=skip::true"
          else
            echo "::set-output name=skip::false"
          fi

  prepare-release:
    needs: check-skip-by-title
    name: Prepare package for release
    runs-on: ubuntu-latest
    if: needs.check-skip-by-title.outputs.skip != 'true'
    steps:
      - name: Release for LP
        if: ${{ github.event.label.name == 'LP-QA' }}
        run: echo "RELEASE=${{ github.event.label.name }}" >> $GITHUB_ENV
      - name: Release for LD
        if: ${{ github.event.label.name == 'LD-QA' }}
        run: echo "RELEASE=${{ github.event.label.name }}" >> $GITHUB_ENV
      - name: Release for Web Server
        if: ${{ github.event.label.name == 'WEB-QA' }}
        run: echo "RELEASE=${{ github.event.label.name }}" >> $GITHUB_ENV
      - name: Check release env
        run: |
          if [[ -z "${{ env.RELEASE }}" ]];
          then
            echo "No release tag found, no jobs will be triggered."
            exit 1
          else
            echo "Building release ${{ env.RELEASE }}." 
            exit 0
          fi
      - name: Show release type
        run: echo ${{ env.RELEASE }}
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - name: Retrieve Git Tags
        if: ${{ !env.ACT }}
        run: |
          git fetch origin "refs/tags/*:refs/tags/*"
          git checkout $(git tag | grep ${{env.RELEASE}} | tail -1)
      - name: Get last tag for current release
        run: |
          export LAST_TAG=$(git tag --sort=committerdate | grep -E "${{env.RELEASE}}-V" | tail -n 1 )
          echo "LAST TAG: $LAST_TAG"
          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV
      - name: Get current incremental version
        run: |
          export LAST_VERSION=$(echo "${{env.LAST_TAG}}"| sed -e "s/${{env.RELEASE}}-V//g")
          echo "LAST_VERSION: $LAST_VERSION"
          echo "LAST_VERSION=$LAST_VERSION" >> $GITHUB_ENV
      - name: Increase the current version number +1
        run: |
          export INCREMENTAL_NUMERIC_VERSION=$(printf "%03d" $((10#${LAST_VERSION} + 1)))
          echo "${{env.RELEASE}}-V$INCREMENTAL_NUMERIC_VERSION"
          echo "NEW_VERSION=${{env.RELEASE}}-V$INCREMENTAL_NUMERIC_VERSION" >> $GITHUB_ENV
      - name: Create Release
        run: |
          if [[ "${{ github.event.act }}" == false || -z "${{ github.event.act }}" ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"

            git tag -a ${{env.NEW_VERSION}} -m "Release ${{env.NEW_VERSION}}"
            git push origin ${{env.NEW_VERSION}}
          else
            echo "Exit from the workflow, act is enabled, no more execution needed."
            exit 0
          fi
