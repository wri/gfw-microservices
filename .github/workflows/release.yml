name: Create Release for Labeled Service

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

jobs:
  createRelease:
    runs-on: ubuntu-latest

    steps:
      - name: Check if pull request has a release label
        id: check_label
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          echo '${{ toJson(github.event.pull_request.labels) }}'
          matched_labels=""
          for label in "WEB-QA" "LD-QA" "LP-QA" "EAPI-QA"; do
            if echo "$labels" | grep -q "\"name\": \"$label\""; then
              matched_labels+="$label "
            fi
          done

          if [[ -n "$matched_labels" ]]; then
            echo "Labels '${matched_labels}' found on the closed pull request."
            echo "::set-output name=labels::${matched_labels}"
          else
            echo "None of the labels 'WEB-QA', 'LD-QA', 'LP-QA' or 'EAPI-QA' found on the closed pull request."
            exit 0
          fi
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ssh-key: '${{ secrets.DEPLOY_KEY }}'

      - name: Setup git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Create the release tag if any release label was found
        id: get_matching_tags
        run: |
          labels="${{ steps.check_label.outputs.labels }}"

          if [ -z "$labels" ]; then
            echo "No matching tags found."
            exit 0
          fi

          if [[ "${{ github.event.act }}" == false || -z "${{ github.event.act }}" ]]; then
            git fetch origin "refs/tags/*:refs/tags/*"
            git fetch --all --tag
            echo "Fetch latest changes"
            # Make sure your local repository is up to date
            git fetch origin

            # Switch to the qa branch
            git checkout qa

            # Rebase onto the develop branch
            git rebase origin/develop

            # Push changes to the qa branch
            git push origin qa
          else
            echo "Skip checkout act is enabled."
          fi

          IFS=' ' read -r -a array <<< "$labels"
          matching_tags=()

          for label in "${array[@]}"; do

            LAST_TAG=$(git tag --sort=creatordate | grep -E "$label-V" | tail -n 1 )
            echo "LAST TAG: $LAST_TAG"

            LAST_VERSION=$(echo "$LAST_TAG" | sed -e "s/$label-V//g")
            echo "LAST_VERSION: $LAST_VERSION"

            INCREMENTAL_NUMERIC_VERSION=$(printf "%03d" $((10#${LAST_VERSION} + 1)))
            NEW_TAG=$(echo $label-V$INCREMENTAL_NUMERIC_VERSION)
            echo "NEW TAG TO CREATE: $NEW_TAG"

            if [[ "${{ github.event.act }}" == false || -z "${{ github.event.act }}" ]]; then
              git tag -a $NEW_TAG -m "Release $NEW_TAG"
              git push origin $NEW_TAG
            else
              echo "Exit from the workflow, act is enabled, no more execution needed."
            fi

            matching_tags+="$label "
          done

          echo "Matching tags found: ${matching_tags[*]}"
          echo "::set-output name=matching_tags::${matching_tags[*]}"

        shell: bash
