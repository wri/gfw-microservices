name: PR Agent

on:
  # Use pull_request_target (not pull_request) so the workflow definition is
  # always read from the BASE branch (main). With `pull_request`, GitHub runs
  # the workflow file from the PR's merge ref, which is only recomputed when the
  # PR branch is pushed to. A PR opened before a workflow change keeps running
  # the OLD workflow until it is rebased/updated.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to replay its opened event (instead of comment_id)
        required: false
        type: string

jobs:
  pr_agent:
    if: |
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      # PR-Agent's /review (and describe/improve) only posts PR/issue comments;
      # it does not push commits, so write access to contents is not needed.
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Manual replay (mirrors The-PR-Agent/pr-agent's pr-agent-review.yaml):
      # when pr_number is supplied via workflow_dispatch, fetch the PR and
      # synthesize a pull_request_target "opened" event so the action below
      # runs a fresh review against that PR.
      - name: Load PR event for manual replay
        if: github.event_name == 'workflow_dispatch'
        id: replay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Supply a numeric PR number"; exit 1; }
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq -e --arg repository "$GH_REPO" '
            if .state != "open" or .draft then error("PR must be open and ready for review")
            else {action: "opened", pull_request: ., sender: {type: "User"},
                  repository: {full_name: $repository}}
            end' > "$GITHUB_WORKSPACE/pr-agent-event.json"
          {
            echo "event_name=pull_request_target"
            echo "event_path=/github/workspace/pr-agent-event.json"
          } >> "$GITHUB_OUTPUT"

      # PR-Agent filters out lockfiles as auto-generated, so a PR that only
      # bumps a lockfile (e.g. package-lock.json) yields an empty diff and the tool
      # errors out ("No PR diff fits the /review request"), failing the check.
      # Detect that case and skip the review instead of reporting a red X.
      - name: Check for reviewable changes
        id: reviewable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr="${{ github.event.issue.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr="${{ inputs.pr_number }}"
          else
            pr="${{ github.event.pull_request.number }}"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/$pr/files" \
            --paginate --jq '.[].filename')
          # Mirrors PR-Agent's AUTO_GENERATED_FILES_EXACT list plus minified
          # assets and source maps (see pr_agent/algo/language_handler.py).
          ignored='(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|Gemfile\.lock|poetry\.lock|go\.sum|uv\.lock|Cargo\.lock|Pipfile\.lock|mix\.lock|pubspec\.lock|bun\.lockb)$|\.(min\.js|min\.css|js\.map|ts\.map|css\.map)$'
          # `|| true` guards against grep exiting 1 when every file matches
          # $ignored: with `bash -eo pipefail` (the default shell), that
          # non-zero status would abort the step instead of yielding count=0.
          # It is grouped with grep so it only applies to grep's exit status.
          count=$(printf '%s\n' "$files" | { grep -vE "$ignored" || true; } | sed '/^[[:space:]]*$/d' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_reviewable=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reviewable=false" >> "$GITHUB_OUTPUT"
            echo "Only lockfiles/minified assets changed; skipping PR-Agent review."
          fi

      - name: Note skipped review
        if: steps.reviewable.outputs.has_reviewable == 'false' && (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.reviewable.outputs.pr }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 PR-Agent skipped: this PR only changes lockfiles/minified assets, which PR-Agent treats as auto-generated and excludes from review."

      - name: Run PR Agent review
        if: steps.reviewable.outputs.has_reviewable == 'true'
        # Pinned to a full commit SHA (not a mutable branch ref) because this
        # job runs on pull_request_target with access to repository secrets.
        # the-pr-agent/pr-agent is the new home of the former qodo-ai/pr-agent.
        # Bump the SHA deliberately when upgrading.
        uses: the-pr-agent/pr-agent@330f0813b5fe0d1f54b794077c2d02aa85a1fb63 # main as of 2026-10-11
        env:
          # Public GitHub repos do not incur GitHub Actions charges, and
          # the PR-Agent project itself is open source. Model API usage still
          # incurs the provider's standard billing, so this key should be set
          # only if you are comfortable with the provider's usage fees.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # For workflow_dispatch replays, point the action at the synthetic
          # pull_request_target event built by the "Load PR event" step; for
          # real events these fall back to the runner-provided defaults.
          GITHUB_EVENT_NAME: ${{ steps.replay.outputs.event_name || github.event_name }}
          GITHUB_EVENT_PATH: ${{ steps.replay.outputs.event_path || '/github/workflow/event.json' }}
          # The setting is `config.model`, and the id must carry the
          # `openrouter/` prefix so LiteLLM routes via OpenRouter and uses
          # OPENROUTER__KEY.
          config.model: 'openrouter/deepseek/deepseek-v4.1-flash'
          config.fallback_models: '["openrouter/z-ai/glm-5.3-flash"]'
          # These ids are not in PR-Agent's MAX_TOKENS table, so set the
          # context window explicitly.
          config.custom_model_max_tokens: '64000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
