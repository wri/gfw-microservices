name: QA e2e Tests

on:
  schedule:
    # Runs at 6 AM UTC (one hour after automatic-release.yml) every weekday
    - cron: '0 6 * * 1-5'

# nx cache intermittently fails with github actions, likely due to parallelism
# so disabling the check for now
env:
  STABLE: 'apps/gfwpro-e2e/cypress/e2e/features/apiMap.feature,apps/gfwpro-e2e/cypress/e2e/features/downloadTemplates.feature,apps/gfwpro-e2e/cypress/e2e/features/alertsRedirectToMap.feature,apps/gfwpro-e2e/cypress/e2e/features/editList.feature,apps/gfwpro-e2e/cypress/e2e/features/CopyList.feature,apps/gfwpro-e2e/cypress/e2e/features/CopyListGFW.feature,apps/gfwpro-e2e/cypress/e2e/features/DeleteList.feature,apps/gfwpro-e2e/cypress/e2e/features/MoveList.feature,apps/gfwpro-e2e/cypress/e2e/features/Map.feature,apps/gfwpro-e2e/cypress/e2e/features/login.feature,apps/gfwpro-e2e/cypress/e2e/features/locationDiagnostics.feature,apps/gfwpro-e2e/cypress/e2e/features/listDiagnosticsRedirectToMap.feature,apps/gfwpro-e2e/cypress/e2e/features/listDiagnostics.feature,apps/gfwpro-e2e/cypress/e2e/features/DownloadList.feature,apps/gfwpro-e2e/cypress/e2e/abilities/list-owner/downloadDiagnostics.feature,apps/gfwpro-e2e/cypress/e2e/abilities/list-owner/regionDiagnostics.feature,apps/gfwpro-e2e/cypress/e2e/abilities/list-owner/treeCoverLossDiagnostics.feature,apps/gfwpro-e2e/cypress/e2e/features/locationDiagnosticsRedirectToMap.feature,apps/gfwpro-e2e/cypress/e2e/features/alerts.feature,apps/gfwpro-e2e/cypress/e2e/features/allDownloads.feature,apps/gfwpro-e2e/cypress/e2e/features/InformationBubbles.feature,apps/gfwpro-e2e/cypress/e2e/features/charts.feature,apps/gfwpro-e2e/cypress/e2e/features/uploadCsvFile.feature'
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  test_qa:
    runs-on: ubuntu-4core-16gb
    timeout-minutes: 90 # Timeout the workflow after 120 minutes = 2 hours

    strategy:
      matrix:
        node-version: [20.11.1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: '${{ secrets.DEPLOY_KEY }}'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install settings
        run: |
          echo "${{secrets.EAPI_E2E_SETTINGS}}" > ./apps/microservices/externalapi-e2e/jest.set.env.ts
          echo "${{secrets.CYPRESS_SETTINGS}}" | tr "'" '"' > ./apps/gfwpro-e2e/cypress.env.json

      - name: Run QA e2e tests for external API
        run: |
          npx nx e2e externalapi-e2e --configuration=qa
        continue-on-error: true

      - name: Run stable QA e2e tests for GFW Pro
        run: |
          npx nx e2e gfwpro-e2e --configuration=qa --spec $STABLE

      - name: Send failure notifications to Slack
        if: failure()
        env:
          SLACK_E2E_TEST_WEBHOOK_URL: ${{ secrets.SLACK_E2E_TEST_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "QA e2e tests failed. Please check the logs ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "username": "GitHub Actions",
            "icon_emoji": ":octocat:"
          }' $SLACK_E2E_TEST_WEBHOOK_URL

      - name: Upload videos of tests failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: dist/cypress/apps/gfwpro-e2e/videos
          retention-days: 2
