version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    # Group minor and patch bumps to keep noise down. Majors are still individual PRs.
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      nestjs:
        patterns:
          - '@nestjs/*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@nrwl/*'
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
      typeorm:
        patterns:
          - 'typeorm'
          - '@nestjs/typeorm'
      types:
        patterns:
          - '@types/*'
    ignore:
      # These require coordinated breaking-change upgrades; handle manually.
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nrwl/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@arcgis/core'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(ci)'
